<html lang="ar" dir="rtl" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر المكملات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   السمات (Themes): default / gold / dark
   ============================================================ */
:root, [data-theme="default"]{
  --bg:#F7F8F4;  --card:#FFFFFF; --ink:#1B2420; --muted:#6B7A72;
  --line:#E6E9E2; --accent:#0B5F3A; --price:#0B5F3A;
  --head-bg:#0B5F3A; --head-ink:#FFFFFF; --head-line:#C8A24A;
  --img-bg:#FFFFFF; --shadow:0 1px 2px rgba(11,95,58,.06),0 8px 24px rgba(11,95,58,.08);
}
[data-theme="gold"]{
  --bg:#FBF6EA;  --card:#FFFFFF; --ink:#2B2310; --muted:#8A7A52;
  --line:#EBDDB8; --accent:#B8902E; --price:#8A6A1F;
  --head-bg:linear-gradient(135deg,#E6CE8E,#C8A24A); --head-ink:#3A2C08; --head-line:#8A6A1F;
  --img-bg:#FFFDF6; --shadow:0 1px 2px rgba(138,106,31,.08),0 8px 24px rgba(138,106,31,.12);
}
[data-theme="dark"]{
  --bg:#0F1311;  --card:#1A201D; --ink:#EDEFEA; --muted:#93A099;
  --line:#2A332F; --accent:#8FD14F; --price:#8FD14F;
  --head-bg:#080B09; --head-ink:#EDEFEA; --head-line:#2A332F;
  --img-bg:#242C28; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);transition:background .2s,color .2s;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* الشريط العلوي */
.topbar{position:sticky;top:0;z-index:40;background:var(--head-bg);color:var(--head-ink);border-bottom:2px solid var(--head-line)}
.topbar-in{display:flex;align-items:center;gap:12px;height:62px}
.brand{flex:1;font-weight:800;font-size:18px;letter-spacing:-.2px}
.icon-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);color:inherit;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.28)}

/* البحث */
.searchbar{padding:16px 0 4px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;box-shadow:var(--shadow)}
.searchbox input{flex:1;border:none;outline:none;background:none;height:100%;min-width:0}
.searchbox input::placeholder{color:var(--muted)}
.searchbox svg{color:var(--muted);flex:none}

/* الشبكة */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 0 50px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(5,1fr)}}

/* بطاقة المنتج */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card-img{aspect-ratio:1;background:var(--img-bg);display:grid;place-items:center;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:contain;padding:8px;display:block}
.noimg{display:grid;place-items:center;gap:4px;color:var(--muted);text-align:center;padding:10px}
.noimg b{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:var(--accent);direction:ltr}
.noimg span{font-size:12px}
.card-body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-name{margin:0;font-weight:700;font-size:14.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:4.35em}
.card-price{margin-top:auto;font-weight:800;font-size:17px;color:var(--price);direction:ltr;text-align:start}
[dir="rtl"] .card-price{text-align:right}

.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}

/* نافذة الإعدادات */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.overlay.on .sheet{transform:none}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;flex:1;font-size:18px;font-weight:800}
.x{width:36px;height:36px;border-radius:10px;background:var(--bg);font-size:20px;font-weight:700;color:var(--muted)}
.group{margin-bottom:18px}
.group h3{margin:0 0 9px;font-size:14px;font-weight:700;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:92px;padding:11px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;text-align:center;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.swatch{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.swatch i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.rates{font-size:12.5px;color:var(--muted);margin:2px 0 0}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

  [347.05,"كيس هدايا فاخر - كبير","Premium Gift Bag - Large","Premium Hediye Çantası Büyük"],
  [314.81,"كيس هدايا فاخر - صغير","Premium Gift Bag - Small","Premium Hediye Çantası Küçük"]
];

/* ============================================================
   🌐 النصوص بكل لغة
   ============================================================ */
const T = {
  ar:{ dir:"rtl", name:"العربية",  search:"ابحث عن منتج...", settings:"الإعدادات",
       theme:"السمة", lang:"اللغة", cur:"العملة", none:"ما لقينا منتج بهذا الاسم",
       themes:{default:"افتراضي", gold:"ذهبي", dark:"داكن"} },
  en:{ dir:"ltr", name:"English",  search:"Search for a product...", settings:"Settings",
       theme:"Theme", lang:"Language", cur:"Currency", none:"No products found",
       themes:{default:"Default", gold:"Gold", dark:"Dark"} },
  tr:{ dir:"ltr", name:"Türkçe",   search:"Ürün ara...", settings:"Ayarlar",
       theme:"Tema", lang:"Dil", cur:"Para birimi", none:"Ürün bulunamadı",
       themes:{default:"Varsayılan", gold:"Altın", dark:"Koyu"} }
};
const LANG_ORDER  = ["ar","en","tr"];
const THEME_ORDER = ["default","gold","dark"];
const CURRENCIES = {
  IQD:{ names:{ar:"دينار عراقي", en:"Iraqi Dinar",   tr:"Irak Dinarı"},  sym:{ar:"د.ع", en:"IQD", tr:"IQD"}, dec:0, after:true },
  TRY:{ names:{ar:"ليرة تركية",  en:"Turkish Lira",  tr:"Türk Lirası"},  sym:{ar:"₺",   en:"₺",   tr:"₺"},   dec:2, after:false },
  USD:{ names:{ar:"دولار أمريكي",en:"US Dollar",     tr:"ABD Doları"},   sym:{ar:"$",   en:"$",   tr:"$"},   dec:2, after:false }
};
const CUR_ORDER = ["IQD","TRY","USD"];

/* ============================================================
   الحالة + الحفظ بالجهاز
   ============================================================ */
const DEFAULTS = { theme:"default", lang:"ar", cur:"IQD" };
let state = { ...DEFAULTS };
try{
  const saved = JSON.parse(localStorage.getItem("store_prefs") || "{}");
  if(THEME_ORDER.includes(saved.theme)) state.theme = saved.theme;
  if(LANG_ORDER.includes(saved.lang))   state.lang  = saved.lang;
  if(CUR_ORDER.includes(saved.cur))     state.cur   = saved.cur;
}catch(e){}
function savePrefs(){ try{ localStorage.setItem("store_prefs", JSON.stringify(state)); }catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* السعر حسب العملة المختارة */
function formatPrice(tryPrice){
  const c = CURRENCIES[state.cur];
  const v = tryPrice * RATES[state.cur];
  const num = v.toLocaleString("en-US", { minimumFractionDigits:c.dec, maximumFractionDigits:c.dec });
  const sym = c.sym[state.lang];
  return c.after ? `${num} ${sym}` : `${sym} ${num}`;
}

/* ============================================================
   العرض
   ============================================================ */
function renderProducts(){
  const q = $("search").value.trim().toLowerCase();
  const html = [];
  PRODUCTS.forEach((p, i) => {
    const id = i + 1;
    const name = p[1 + LANG_ORDER.indexOf(state.lang)];
    if(q && ![p[1],p[2],p[3]].some(n => n.toLowerCase().includes(q))) return;
    html.push(`
      <article class="card">
        <div class="card-img">
          <img src="${IMG_FOLDER}/${id}.${IMG_EXT}" alt="${esc(name)}" loading="lazy" data-id="${id}">
        </div>
        <div class="card-body">
          <h3 class="card-name" dir="auto">${esc(name)}</h3>
          <div class="card-price">${esc(formatPrice(p[0]))}</div>
        </div>
      </article>`);
  });
  $("grid").innerHTML = html.length ? html.join("") : `<div class="empty">${esc(T[state.lang].none)}</div>`;
}

/* إذا الصورة مو موجودة: يطلع مربع يكتب اسم الملف المطلوب (مثل 1.png) */
document.addEventListener("error", e => {
  const img = e.target;
  if(img.tagName !== "IMG" || !img.dataset.id) return;
  const box = img.parentElement;
  box.innerHTML = `<div class="noimg"><b>${img.dataset.id}.${IMG_EXT}</b><span>${IMG_FOLDER}/</span></div>`;
}, true);

function renderOptions(){
  const L = T[state.lang];
  $("themeOpts").innerHTML = THEME_ORDER.map(k => {
    const sw = {
      default:["#0B5F3A","#F7F8F4","#C8A24A"],
      gold:["#E6CE8E","#FBF6EA","#8A6A1F"],
      dark:["#080B09","#1A201D","#8FD14F"]
    }[k];
    return `<button class="opt ${state.theme===k?"on":""}" data-theme-opt="${k}">
      <div class="swatch">${sw.map(c=>`<i style="background:${c}"></i>`).join("")}</div>${esc(L.themes[k])}</button>`;
  }).join("");
  $("langOpts").innerHTML = LANG_ORDER.map(k =>
    `<button class="opt ${state.lang===k?"on":""}" data-lang-opt="${k}">${esc(T[k].name)}</button>`).join("");
  $("curOpts").innerHTML = CUR_ORDER.map(k =>
    `<button class="opt ${state.cur===k?"on":""}" data-cur-opt="${k}">${esc(CURRENCIES[k].names[state.lang])}</button>`).join("");
}

function applyAll(){
  const L = T[state.lang];
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.lang = state.lang;
  document.documentElement.dir  = L.dir;
  const name = STORE_NAME[state.lang];
  $("brand").textContent = name;
  document.title = name;
  $("search").placeholder = L.search;
  $("sTitle").textContent = L.settings;
  $("hTheme").textContent = L.theme;
  $("hLang").textContent  = L.lang;
  $("hCur").textContent   = L.cur;
  renderOptions();
  renderProducts();
}

/* أحداث */
$("search").addEventListener("input", renderProducts);
$("openSettings").addEventListener("click", () => $("overlay").classList.add("on"));
$("closeSettings").addEventListener("click", () => $("overlay").classList.remove("on"));
$("overlay").addEventListener("click", e => { if(e.target === $("overlay")) $("overlay").classList.remove("on"); });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("overlay").classList.remove("on"); });
$("overlay").addEventListener("click", e => {
  const b = e.target.closest("[data-theme-opt],[data-lang-opt],[data-cur-opt]");
  if(!b) return;
  if(b.dataset.themeOpt) state.theme = b.dataset.themeOpt;
  if(b.dataset.langOpt)  state.lang  = b.dataset.langOpt;
  if(b.dataset.curOpt)   state.cur   = b.dataset.curOpt;
  savePrefs(); applyAll();
});

applyAll();
</script>
</body>
</html>
