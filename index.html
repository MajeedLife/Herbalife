<!-- شريط الأقسام العلوي -->
<nav class="cat-bar">
  <div class="wrap cat-scroll" id="catBar"></div>
</nav>

<main class="wrap">
  <div class="searchbar">
    <label class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search" autocomplete="off">
    </label>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- الإعدادات -->
<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sTitle"></h2><button class="x" id="closeSettings" aria-label="close">×</button></div>
    <div class="group"><h3 id="hTheme"></h3><div class="opts" id="themeOpts"></div></div>
    <div class="group"><h3 id="hLang"></h3><div class="opts" id="langOpts"></div></div>
    <div class="group"><h3 id="hCur"></h3><div class="opts" id="curOpts"></div></div>
  </div>
</div>

<!-- نافذة معلومات المنتج المخصصة (تتأثر بالثيم تلقائياً) -->
<div class="overlay" id="infoOverlay">
  <div class="sheet info-modal" role="dialog" aria-modal="true">
    <button class="x modal-close" id="closeInfoModal" aria-label="close">×</button>
    <div class="info-modal-body">
      <div class="info-modal-img">
        <img id="infoModalImg" src="" alt="product image">
      </div>
      <div class="info-modal-content">
        <h2 id="infoModalTitle"></h2>
        <div class="info-modal-price" id="infoModalPrice"></div>
        <div class="info-modal-desc-box">
          <p id="infoModalDesc"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
